# Claude Code 実行中・最近の処理
# tool は Claude Code のみ。Codex 以外を全部拾うと Cursor が混ざる。
type: markdown
title: Claude Code 実行中・最近の処理
content: |
  {% set jobs = state_attr('sensor.claude_jobs', 'jobs') or [] %}
  {% set rows = jobs
    | selectattr('kind', 'equalto', 'adhoc')
    | selectattr('tool', 'equalto', 'Claude Code')
    | list %}
  {% if rows | length == 0 %}
  処理なし
  {% else %}
  | ジョブ | 状態 | 段階 | モデル |
  | --- | --- | --- | --- |
  {% for job in rows | sort(attribute='started', reverse=true) %}
  | {{ job.name }} | {{ job.status }} | {{ job.stage }} | {{ job.model or '-' }} |
  {% endfor %}
  {% endif %}
