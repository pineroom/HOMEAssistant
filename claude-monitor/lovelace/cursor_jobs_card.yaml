type: markdown
title: Cursor 実行中・最近の処理
content: |
  {% set jobs = state_attr('sensor.claude_jobs', 'jobs') or [] %}
  {% set ns = namespace(rows=[]) %}
  {% set labels = {'local': 'ローカル', 'cloud': 'Cloud', 'worker': 'Worker', 'grok-bot': 'Grok Bot'} %}
  {% for job in jobs %}
    {% set tool = job.get('tool') or job.get('agent') %}
    {% set kind = job.get('kind') or job.get('type') or 'adhoc' %}
    {% if kind == 'adhoc' and tool == 'Cursor' %}
      {% set ns.rows = ns.rows + [job] %}
    {% endif %}
  {% endfor %}
  {% set rows = ns.rows %}
  {% if rows | length == 0 %}
  処理なし
  {% else %}

  | ジョブ | 経路 | 状態 | 段階 | モデル |
  | --- | --- | --- | --- | --- |
  {%- for job in rows %}
  | {{ job.get('name') }} | {{ labels.get(job.get('surface') or 'local', 'ローカル') }} | {{ job.get('status') or '-' }} | {{ job.get('stage') or '-' }} | {{ job.get('model') or '-' }} |
  {%- endfor %}
  {% endif %}
