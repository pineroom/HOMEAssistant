# Cursor 実行中・最近の処理
type: markdown
title: Cursor 実行中・最近の処理
content: |
  {% set jobs = state_attr('sensor.claude_jobs', 'jobs') or [] %}
  {% set rows = jobs
    | selectattr('kind', 'equalto', 'adhoc')
    | selectattr('tool', 'equalto', 'Cursor')
    | list %}
  {% if rows | length == 0 %}
  処理なし
  {% else %}
  | ジョブ | 経路 | 状態 | 段階 | モデル |
  | --- | --- | --- | --- | --- |
  {% for job in rows | sort(attribute='started', reverse=true) %}
  {% set surface = job.surface | default('local') %}
  {% set surface_label = {
    'local': 'ローカル',
    'cloud': 'Cloud',
    'worker': 'Worker',
    'grok-bot': 'Grok Bot'
  }[surface] | default(surface) %}
  | {{ job.name }} | {{ surface_label }} | {{ job.status }} | {{ job.stage }} | {{ job.model or '-' }} |
  {% endfor %}
  {% endif %}
