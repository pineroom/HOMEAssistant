type: markdown
title: Cursor 制限表示
content: |
  {% set usage = state_attr('sensor.claude_jobs', 'usage') or {} %}
  {% set cursor = usage.get('cursor') or {} %}
  {% set limits = cursor.get('rate_limits') or {} %}
  {% set from_mqtt = state_attr('sensor.claude_cursor_limits', 'windows') %}
  {% set windows = from_mqtt or limits.get('windows') or [] %}
  {% if windows | length == 0 %}
  取得不可
  {% else %}

  | 枠 | 使用率 | バー | リセット |
  | --- | --- | --- | --- |
  {%- for row in windows %}
  | {{ row.get('label') }} | {{ row.get('percent_label') or '-' }} | `{{ row.get('bar') }}` | {{ row.get('reset') or '-' }} |
  {%- endfor %}
  {% endif %}
