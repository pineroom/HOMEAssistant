# Cursor 制限表示（Cursor Models / Other Models / Grok Bot）
type: markdown
title: Cursor 制限表示
content: |
  {% set usage = state_attr('sensor.claude_jobs', 'usage') or {} %}
  {% set cursor = usage.cursor or {} %}
  {% set limits = cursor.rate_limits or {} %}
  {% set windows = limits.windows or [] %}
  {% if windows | length == 0 %}
  取得不可
  {% else %}

  | 枠 | 使用率 | バー | リセット |
  | --- | --- | --- | --- |
  {%- for row in windows %}
  | {{ row.label }} | {{ row.percent_label or '-' }} | `{{ row.bar }}` | {{ row.reset or '-' }} |
  {%- endfor %}
  {% endif %}
